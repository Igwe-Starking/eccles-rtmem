name: Bug report
description: Something misbehaves (wrong pointer, rejected free that shouldn't be, crash, build error)
labels: [bug]
body:
  - type: input
    id: target
    attributes:
      label: Target and toolchain
      description: Chip/board, RTOS (if any), compiler and version
      placeholder: "STM32G0, FreeRTOS via CubeMX, arm-none-eabi-gcc 13.2"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Every ECCLES_RT_* macro you set (or "defaults")
      render: c
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest sequence of eccles_rt_malloc/eccles_rt_free calls that shows it
      render: c
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
