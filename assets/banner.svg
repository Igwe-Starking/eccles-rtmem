<text x="186" y="142" class="t" font-size="76" font-weight="800" fill="url(#acb)">EcclesRTLib</text>
<text x="82" y="214" class="t" font-size="30" fill="#e2e8f0">Predictable memory for chips</text>
<text x="82" y="252" class="t" font-size="30" fill="#e2e8f0">that can't afford surprises.</text>
<rect x="80.0" y="277" width="128.9" height="38" rx="19" fill="#0f172a" stroke="#334155"/><text x="144.43" y="302" text-anchor="middle" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="17" fill="#e2e8f0">plain C99</text>
