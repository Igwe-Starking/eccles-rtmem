<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="bt bd">
<title id="bt">EcclesRTLib</title>
<desc id="bd">EcclesRTLib RuntimeMemory: a fixed-pool memory allocator for microcontrollers. Three pools of fixed-size blocks, some allocated and some free.</desc>
